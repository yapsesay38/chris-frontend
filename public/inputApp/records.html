<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>All Records - CAR Rice Collection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script defer src="https://unpkg.com/pocketbase@0.21.1/dist/pocketbase.umd.js"></script>
    <script defer src="js/tables.js"></script>
    <script defer src="js/app.js"></script>
    <script defer src="js/offline.js"></script>
    <script defer src="js/sw-register.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    <div x-data="offlineBanner()" 
         x-show="isOffline"
         x-init="init()"
         style="display: none; background: #f85149; color: white; text-align: center; padding: 12px; font-size: 14px; position: sticky; top: 0; z-index: 10000; font-weight: 500; cursor: pointer;"
         @click="hideBanner()">
         📡 You are offline. Data will be saved locally.
    </div>
    <div class="container" x-data="allRecordsApp()" x-init="init()">
        <header class="app-header">
            <div class="header-content">
                <a class='btn-back' href='index.html'>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </a>
                <div class="header-titles">
                    <h1>All Records</h1>
                    <p class="subtitle">Complete database of all provinces</p>
                </div>
            </div>
        </header>

        <div class="config-bar" style="background: var(--bg-input); padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;">
            <div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap;">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <label style="font-weight: 600;">Filter by Province:</label>
                    <select x-model="provinceFilter" @change="filterRecords()" style="padding: 6px 10px; background: var(--bg-secondary); border: 1px solid var(--border-color); color: white; border-radius: 6px;" class="border-hover">
                        <option value="">All Provinces</option>
                        <option value="Abra">Abra</option>
                        <option value="Apayao">Apayao</option>
                        <option value="Benguet">Benguet</option>
                        <option value="Ifugao">Ifugao</option>
                        <option value="Kalinga">Kalinga</option>
                        <option value="Mountain Province">Mountain Province</option>
                    </select>
                </div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <label style="font-weight: 600;">Filter by Table:</label>
                    <select x-model="tableFilter" @change="filterRecords()" style="padding: 6px 10px; background: var(--bg-secondary); border: 1px solid var(--border-color); color: white; border-radius: 6px;" class="border-hover">
                        <option value="">All Tables</option>
                        <template x-for="table in availableTables" :key="table.id">
                            <option :value="table.id" x-text="table.name"></option>
                        </template>
                    </select>
                </div>
            </div>
            <div style="display: flex; align-items: center; gap: 16px;">
                <div style="color: var(--accent-success); font-size: 14px;">
                    📊 Showing: <span x-text="filteredRecords.length"></span> of <span x-text="allRecords.length"></span> records
                </div>
                <button class="export-btn border-hover" @click="exportFilteredData()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    Export Filtered Data
                </button>
                <button class="export-btn border-hover" @click="uploadFilteredData($event)" style="background: #58a6ff;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 15v4a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Upload to Server
                </button>
                <button class="export-btn border-hover" @click="triggerImport()" style="background: #3fb950;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 15v4a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Import CSV
                </button>
                <input type="file" id="csvImportInput" accept=".csv" style="display: none;" @change="importCSV($event)">
            </div>
        </div>

        <div class="records-section">
            <div class="table-container">
                <table id="records-table">
                    <thead>
                        <tr>
                            <th>Province</th>
                            <th>Table</th>
                            <th>Block No. / Treatment No.</th>
                            <th>Landrace Name / Sample ID</th>
                            <th>Trials</th>
                            <th>Recorded Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="(record, idx) in filteredRecords" :key="idx">
                            <tr>
                                <td x-text="record.province"></td>
                                <td x-text="record.tableName || record.tableId"></td>
                                <td x-text="record.treatmentNo"></td>
                                <td><strong x-text="record.landrace"></strong></td>
                                <td x-text="record.trialCount || 5"></td>
                                <td x-text="record.formattedDate"></td>
                                <td class="action-btns">
                                    <button class="btn-icon export-single" @click="exportSingleRecord(idx)" title="Export to CSV">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                            <polyline points="7 10 12 15 17 10"/>
                                            <line x1="12" y1="15" x2="12" y2="3"/>
                                        </svg>
                                    </button>
                                    <button class="btn-icon edit" @click="editRecord(idx)" title="Edit Record">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                            <path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                        </svg>
                                    </button>
                                    <button class="btn-icon delete" @click="deleteRecord(idx)" title="Delete Record">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <polyline points="3 6 5 6 21 6"></polyline>
                                            <path d="M19 6v14a2 2 0 0 1-2-2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                            <line x1="10" y1="11" x2="10" y2="17"></line>
                                            <line x1="14" y1="11" x2="14" y2="17"></line>
                                        </svg>
                                    </button>
                                 </div>
                             </div>
                        </template>
                    </tbody>
                 </div>
                <div class="empty-state" x-show="filteredRecords.length === 0" style="text-align: center; padding: 40px; color: #8b949e;">
                    No records found. Add records using the data collection form.
                </div>
            </div>
        </div>
    </div>
</body>
</html>
