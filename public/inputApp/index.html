<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Rice Input</title>
    <meta name="description" content="Explore the six provinces of the Cordillera Administrative Region (CAR) in the Philippines." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="style.css" />

    <link rel="icon" type="image/svg+xml" href="rice_favicon/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="rice_favicon/favicon-96x96.png">
    <link rel="icon" type="image/x-icon" href="rice_favicon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="rice_favicon/apple-touch-icon.png">

    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#10b981" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CAR Rice" />
    
    <script defer src="js/provinces.js"></script>
    <script defer src="js/offline.js"></script>
    <script defer src="js/sw-register.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    <div x-data="offlineBanner()" 
         x-show="isOffline"
         style="display: none; background: #f85149; color: white; text-align: center; padding: 12px; font-size: 14px; position: sticky; top: 0; z-index: 10000; font-weight: 500; cursor: pointer;"
         >
         📡 You are offline. Data will be saved locally.
    </div>
    <div class="container" x-data="provincesApp()">
        <header>
            <h1>Cordillera Administrative Region</h1>
            <p>The highlands of the Philippines</p>
        </header>
        
        <section class="provinces-container" aria-label="Provinces of CAR">
            <template x-for="province in provinces">
                <a class="province-link" :href="`form.html?province=${province.name}`">
                    <article class="province-card" :class="`block-${province.color}`">
                        <div class="card-content">
                            <h2 x-text="province.name"></h2>
                            <p x-text="province.desc"></p>
                        </div>
                    </article>
                </a>
            </template>
        </section>

      <footer style="display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 50px;">
        <a class='btn btn-secondary' href='/' style="transition: background 0.2s ease;" x-show="!$store.offline.isOffline">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back to CHRIS
        </a>
        
        <a class='btn btn-secondary' href='records.html' style="transition: background 0.2s ease;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 3h18v18H3zM3 9h18M9 21V9"/>
            </svg>
            Records Table
        </a>
      </footer>
    </div>
</body>
</html>
