<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Cordillera Administrative Region – Philippines</title>
    <meta name="description" content="Explore the six provinces of the Cordillera Administrative Region (CAR) in the Philippines." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#10b981" />
    <link rel="apple-touch-icon" href="icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <script defer src="js/provinces.js"></script>
    <script defer src="js/offline.js"></script>
    <script defer src="js/sw-register.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    <!-- Offline banner - standalone component -->
    <div x-data="offlineBanner()" 
         x-show="isOffline"
         x-init="init()"
         style="display: none; background: #f85149; color: white; text-align: center; padding: 12px; font-size: 14px; position: sticky; top: 0; z-index: 10000; font-weight: 500; cursor: pointer;"
         @click="hideBanner()">
         📡 You are offline. Data will be saved locally.
    </div>
    <div class="container" x-data="provincesApp()">
        <header>
            <h1>Cordillera Administrative Region</h1>
            <p>The highlands of the Philippines</p>
        </header>
        
        <section class="provinces-container" aria-label="Provinces of CAR">
            <template x-for="province in provinces">
                <a class="province-link" :href="`form.html?province=${province.name}`">
                    <article class="province-card" :class="`block-${province.color}`">
                        <div class="card-content">
                            <h2 x-text="province.name"></h2>
                            <p x-text="province.desc"></p>
                        </div>
                    </article>
                </a>
            </template>
        </section>
        
        <footer>
            <a class='btn btn-secondary' href='/'>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Back to CHRIS
            </a>
        </footer>
    </div>
</body>
</html>
