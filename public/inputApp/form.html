<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Record Rice Characteristics - CAR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    <div id="offline-banner" style="display: none; background: #f85149; color: white; text-align: center; padding: 12px; font-size: 14px; position: sticky; top: 0; z-index: 10000;">
        📡 You are offline. Data will be saved locally.
    </div>

    <div class="container" x-data="riceDataApp()" x-init="init()">
        <header class="app-header">
            <div class="header-content">
                <a class='btn-back' href='index.html'>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </a>
                <div class="header-titles">
                    <h1 x-text="currentProvince || 'Loading...'"></h1>
                    <p class="subtitle">Agromorphological Data Collection</p>
                </div>
            </div>
        </header>

        <div class="config-bar" style="background: var(--bg-input); padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;">
            <div style="display: flex; align-items: center; gap: 8px;">
                <label style="font-weight: 600;">Number of Trials:</label>
                <input type="number" x-model="trialCount" @change="updateTrialCount()" 
                       min="1" max="100" style="width: 80px; padding: 6px 10px; background: var(--bg-secondary); border: 1px solid var(--border-color); color: white; border-radius: 6px;">
                <span style="color: var(--text-muted); font-size: 12px;">(1-100 trials)</span>
            </div>
            <div style="color: var(--accent-success); font-size: 14px;">
                 Currently: <span x-text="trialCount"></span> trial(s)
            </div>
        </div>

        <div class="form-container">
            <form @submit.prevent="saveRecord()">
                <input type="hidden" name="province" x-model="currentProvince">
                <input type="hidden" name="edit-index" x-model="editIndex">
                
                <div class="metadata-grid">
                    <div class="input-group">
                        <label for="treatment-no">Block No. / Treatment No.</label>
                        <input type="text" id="treatment-no" name="treatment-no" required 
                               x-model="treatmentNo"
                               placeholder="e.g. B1-T1">
                    </div>
                    <div class="input-group">
                        <label for="landrace">Landrace Name</label>
                        <input type="text" id="landrace" name="landrace" required 
                               x-model="landrace"
                               placeholder="e.g. Traditional Rice A">
                    </div>
                </div>

                <div class="section-divider">
                    <span>Agromorphological Parameters (<span x-text="trialCount"></span> Trials)</span>
                </div>

                <!-- SINGLE LOOP - Preserves original parameter order -->
                <template x-for="param in parameters" :key="param.id">
                    <div class="form-group">
                        <label x-text="param.label"></label>
                        <div class="trial-row" :style="`grid-template-columns: repeat(${trialCount}, 1fr);`">
                            
                            <!-- For SELECT parameters -->
                            <template x-if="param.type === 'select'">
                                <template x-for="(trial, idx) in trials" :key="idx">
                                    <div class="trial-input-wrapper" :data-trial="`T${idx + 1}`">
                                        <select x-model="trials[idx][param.id]">
                                            <option value="">Select...</option>
                                            <template x-for="(label, value) in param.options">
                                                <option :value="value" x-text="`${value}-${label}`"></option>
                                            </template>
                                        </select>
                                    </div>
                                </template>
                            </template>
                            
                            <!-- For NUMBER parameters -->
                            <template x-if="param.type === 'number'">
                                <template x-for="(trial, idx) in trials" :key="idx">
                                    <div class="trial-input-wrapper" :data-trial="`T${idx + 1}`">
                                        <input type="number" 
                                               :step="param.step || '1'"
                                               x-model="trials[idx][param.id]"
                                               :placeholder="`T${idx + 1}`">
                                    </div>
                                </template>
                            </template>
                            
                        </div>
                    </div>
                </template>

                <div class="button-group">
                    <a class='btn btn-secondary' href='index.html'>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                        Back
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                            <polyline points="17 21 17 13 7 13 7 21"></polyline>
                            <polyline points="7 3 7 8 15 8"></polyline>
                        </svg>
                        <span x-text="editMode ? 'Update Record' : 'Save Data'"></span>
                    </button>
                    <button type="button" class="btn btn-secondary" 
                            x-show="editMode" 
                            @click="cancelEdit()"
                            style="display: none;">Cancel Edit</button>
                </div>
            </form>
        </div>

        <div class="records-section">
            <div class="section-header">
                <h2>Records Preview</h2>
                <button class="export-btn" @click="exportToCSV()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    Export to Excel (CSV)
                </button>
            </div>
            <div class="table-container">
                <table id="records-table">
                    <thead>
                        <tr>
                            <th>Province</th>
                            <th>Block/Treatment</th>
                            <th>Landrace</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="(record, idx) in filteredRecords" :key="idx">
                            <tr>
                                <td x-text="record.province"></td>
                                <td x-text="record.treatmentNo"></td>
                                <td><strong x-text="record.landrace"></strong></td>
                                <td class="action-btns">
                                    <button class="btn-icon edit" @click="editRecord(idx)" title="Edit Record">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                            <path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                        </svg>
                                    </button>
                                    <button class="btn-icon delete" @click="deleteRecord(idx)" title="Delete Record">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <polyline points="3 6 5 6 21 6"></polyline>
                                            <path d="M19 6v14a2 2 0 0 1-2-2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                            <line x1="10" y1="11" x2="10" y2="17"></line>
                                            <line x1="14" y1="11" x2="14" y2="17"></line>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </template>
                    </tbody>
                </div>
                <div class="empty-state" x-show="filteredRecords.length === 0" style="text-align: center; padding: 40px; color: #8b949e;">
                    No records found yet. Start by entering data above!
                </div>
            </div>
        </div>
    </div>

    <script>
        function riceDataApp() {
            const STORAGE_KEY = 'heirloom_rice_records';
            
            const DEFAULT_TRIAL_COUNT = 5;
            const MAX_TRIALS = 100;
            const MIN_TRIALS = 1;
            
            // PARAMETERS IN ORIGINAL ORDER - mixed types
            const parameters = [
                // Select parameters
                { id: 'plantVigor', label: 'Plant Vigor and Leaf Characteristics', type: 'select', options: { '1': 'Very Vigorous', '2': 'Vigorous', '3': 'Normal', '4': 'Weak', '5': 'Very Weak' } },
                { id: 'basalLeafSheet', label: 'Basal Leaf Sheet', type: 'select', options: { '1': 'Green', '2': 'Purple Lines', '3': 'Light Purple', '4': 'Purple' } },
                { id: 'leafSheathAnthocyanin', label: 'Leaf Sheath Anthocyanin Coloration', type: 'select', options: { '0': 'Absent', '3': 'Weak', '5': 'Medium', '7': 'Strong' } },
                { id: 'bladeAnthocyanin', label: 'Blade Anthocyanin Coloration', type: 'select', options: { '1': 'Tips Only', '2': 'On Margins Only', '3': 'In Blotches', '4': 'Even (Uniform Purple)' } },
                { id: 'bladeIntensityGreen', label: 'Blade Intensity of Green Color', type: 'select', options: { '0': 'No Green Color', '3': 'Light Green', '5': 'Medium Green', '7': 'Dark Green' } },
                { id: 'bladePubescence', label: 'Blade Pubescence', type: 'select', options: { '1': 'Glabrous', '2': 'Intermediate', '3': 'Pubescent' } },
                { id: 'auricleColor', label: 'Auricle Color', type: 'select', options: { '0': 'Absent', '1': 'Whitish', '2': 'Yellowish Green', '3': 'Purple', '4': 'Light Purple', '5': 'Purple Lines' } },
                { id: 'collarColor', label: 'Collar Color', type: 'select', options: { '0': 'Absent', '1': 'Green', '2': 'Light Green', '3': 'Purple', '4': 'Purple Lines' } },
                { id: 'liguleShape', label: 'Ligule Shape', type: 'select', options: { '0': 'Absent', '1': 'Truncate', '2': 'Acute to Acuminate', '3': '2-Cleft' } },
                { id: 'liguleColor', label: 'Ligule Color', type: 'select', options: { '0': 'Absent', '1': 'Whitish', '2': 'Yellowish Green', '3': 'Purple', '4': 'Light Purple', '5': 'Purple Lines' } },
                { id: 'liguleLength', label: 'Ligule Length (mm)', type: 'number', step: '0.1' },
                { id: 'flagLeafAttitude', label: 'Flag Leaf Attitude', type: 'select', options: { '1': 'Erect', '3': 'Intermediate', '5': 'Horizontal', '7': 'Descending' } },
                { id: 'leafLength', label: 'Flag Leaf and Penultimate Leaf Length (cm)', type: 'number', step: '0.1' },
                { id: 'leafWidth', label: 'Flag Leaf and Penultimate Leaf Width (cm)', type: 'number', step: '0.1' },
                { id: 'culmHabitAngle', label: 'Culm Habit Angle', type: 'select', options: { '1': 'Erect (<15°)', '3': 'Semi-erect (20°)', '5': 'Open (40°)', '7': 'Spreading (>60°-80°)', '9': 'Procumbent' } },
                { id: 'tillerCount', label: 'Tiller Count', type: 'number', step: '1' }
            ];
            
            const loadRecords = () => JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            const saveRecords = (records) => localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
            
            const urlParams = new URLSearchParams(window.location.search);
            const provinceFromUrl = urlParams.get('province') || '';
            
            const buildEmptyTrial = () => {
                const trial = {};
                parameters.forEach(param => {
                    trial[param.id] = '';
                });
                return trial;
            };
            
            const buildTrials = (count) => {
                return Array(count).fill().map(() => buildEmptyTrial());
            };
            
            return {
                currentProvince: provinceFromUrl,
                treatmentNo: '',
                landrace: '',
                editMode: false,
                editIndex: -1,
                isOnline: navigator.onLine,
                parameters: parameters,
                trialCount: DEFAULT_TRIAL_COUNT,
                trials: buildTrials(DEFAULT_TRIAL_COUNT),
                records: loadRecords(),
                
                get filteredRecords() {
                    if (!this.currentProvince) return this.records;
                    return this.records.filter(r => r.province === this.currentProvince);
                },
                
                updateTrialCount() {
                    let newCount = parseInt(this.trialCount);
                    if (isNaN(newCount)) newCount = MIN_TRIALS;
                    if (newCount < MIN_TRIALS) newCount = MIN_TRIALS;
                    if (newCount > MAX_TRIALS) newCount = MAX_TRIALS;
                    if (newCount === this.trials.length) return;
                    
                    const oldTrials = this.trials;
                    const newTrials = [];
                    for (let i = 0; i < newCount; i++) {
                        if (i < oldTrials.length) {
                            newTrials.push(oldTrials[i]);
                        } else {
                            newTrials.push(buildEmptyTrial());
                        }
                    }
                    this.trials = newTrials;
                    this.trialCount = newCount;
                    this.saveDraft();
                },
                
                saveDraft() {
                    const draftKey = `rice_draft_${this.currentProvince || 'unknown'}`;
                    const hasData = this.trials.some(trial => Object.values(trial).some(v => v !== '' && v !== null)) || this.treatmentNo || this.landrace;
                    if (hasData) {
                        localStorage.setItem(draftKey, JSON.stringify({
                            treatmentNo: this.treatmentNo,
                            landrace: this.landrace,
                            trialCount: this.trialCount,
                            trials: this.trials
                        }));
                    }
                },
                
                loadDraft() {
                    if (this.editMode) return;
                    const draftKey = `rice_draft_${this.currentProvince || 'unknown'}`;
                    const draft = JSON.parse(localStorage.getItem(draftKey));
                    if (draft) {
                        this.treatmentNo = draft.treatmentNo || '';
                        this.landrace = draft.landrace || '';
                        if (draft.trialCount) {
                            this.trialCount = draft.trialCount;
                            this.trials = draft.trials || buildTrials(this.trialCount);
                        }
                    }
                },
                
                clearDraft() {
                    localStorage.removeItem(`rice_draft_${this.currentProvince || 'unknown'}`);
                },
                
                saveRecord() {
                    if (!this.treatmentNo || !this.landrace) {
                        alert('Please fill in Block/Treatment No. and Landrace Name');
                        return;
                    }
                    const record = {
                        province: this.currentProvince,
                        treatmentNo: this.treatmentNo,
                        landrace: this.landrace,
                        trialCount: this.trialCount,
                        trials: JSON.parse(JSON.stringify(this.trials)),
                        timestamp: Date.now()
                    };
                    if (this.editMode && this.editIndex >= 0) {
                        this.records[this.editIndex] = record;
                        alert('Record updated successfully!');
                        this.cancelEdit();
                    } else {
                        this.records.push(record);
                        alert('Data saved successfully!');
                        this.resetForm();
                    }
                    saveRecords(this.records);
                    this.clearDraft();
                    this.records = loadRecords();
                },
                
                editRecord(index) {
                    const record = this.records[index];
                    this.editMode = true;
                    this.editIndex = index;
                    this.currentProvince = record.province;
                    this.treatmentNo = record.treatmentNo;
                    this.landrace = record.landrace;
                    this.trialCount = record.trialCount || DEFAULT_TRIAL_COUNT;
                    this.trials = JSON.parse(JSON.stringify(record.trials));
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                },
                
                deleteRecord(index) {
                    if (confirm('Are you sure you want to delete this record?')) {
                        this.records.splice(index, 1);
                        saveRecords(this.records);
                        this.records = loadRecords();
                    }
                },
                
                cancelEdit() {
                    this.editMode = false;
                    this.editIndex = -1;
                    this.resetForm();
                },
                
                resetForm() {
                    this.treatmentNo = '';
                    this.landrace = '';
                    this.trialCount = DEFAULT_TRIAL_COUNT;
                    this.trials = buildTrials(DEFAULT_TRIAL_COUNT);
                    if (this.currentProvince) this.loadDraft();
                },
                
                exportToCSV() {
                    if (this.records.length === 0) {
                        alert('No records to export.');
                        return;
                    }
                    const headers = ['Province', 'Block/Treatment No.', 'Landrace Name'];
                    const params = this.parameters.map(p => p.id);
                    params.forEach(param => {
                        for (let i = 1; i <= 20; i++) {
                            headers.push(`${param.toUpperCase()} T${i}`);
                        }
                    });
                    const csvRows = [headers.join(',')];
                    this.records.forEach(record => {
                        const row = [record.province, record.treatmentNo, record.landrace];
                        const trialCount = record.trialCount || DEFAULT_TRIAL_COUNT;
                        params.forEach(param => {
                            for (let i = 0; i < 20; i++) {
                                if (i < trialCount && record.trials[i]) {
                                    let value = record.trials[i][param] || '';
                                    const paramConfig = this.parameters.find(p => p.id === param);
                                    if (paramConfig?.type === 'select' && value && paramConfig.options[value]) {
                                        value = `${value}-${paramConfig.options[value]}`;
                                    }
                                    row.push(value);
                                } else {
                                    row.push('');
                                }
                            }
                        });
                        csvRows.push(row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(','));
                    });
                    const csvContent = "\uFEFF" + csvRows.join('\n');
                    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = `heirloom_rice_records_${new Date().toISOString().slice(0,10)}.csv`;
                    link.click();
                    URL.revokeObjectURL(url);
                },
                
                updateOfflineBanner(isOffline) {
                    const banner = document.getElementById('offline-banner');
                    if (banner) banner.style.display = isOffline ? 'block' : 'none';
                },
                
                init() {
                    window.addEventListener('online', () => { this.isOnline = true; this.updateOfflineBanner(false); });
                    window.addEventListener('offline', () => { this.isOnline = false; this.updateOfflineBanner(true); });
                    this.loadDraft();
                    if (this.currentProvince) document.title = `${this.currentProvince} - CAR Rice Collection`;
                    this.updateOfflineBanner(!navigator.onLine);
                }
            };
        }
        
        (function() {
            const banner = document.getElementById('offline-banner');
            if (banner && !navigator.onLine) banner.style.display = 'block';
        })();
        
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch((err) => console.log('SW failed:', err)));
        }
    </script>
</body>
</html>
