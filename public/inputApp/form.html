<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Record Rice Characteristics - CAR</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css" />

    <link rel="icon" type="image/svg+xml" href="rice_favicon/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="rice_favicon/favicon-96x96.png">
    <link rel="icon" type="image/x-icon" href="rice_favicon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="rice_favicon/apple-touch-icon.png">

    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#10b981" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CAR Rice" />
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      window.SUPABASE_URL = '{{ .Env.SUPABASE_URL }}';
      window.SUPABASE_ANON_KEY = '{{ .Env.SUPABASE_ANON_KEY }}';
    </script>

    <script defer src="js/tables.js"></script>
    <script defer src="js/app.js"></script>
    <script defer src="js/offline.js"></script>
    <script defer src="js/sw-register.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    <div x-data="offlineBanner()" 
         x-show="isOffline"
         style="display: none; background: #f85149; color: white; text-align: center; padding: 12px; font-size: 14px; position: sticky; top: 0; z-index: 10000; font-weight: 500; cursor: pointer;"
         >
         📡 You are offline. Data will be saved locally.
    </div>
    <div class="container" x-data="riceDataApp()">
        <header class="app-header">
            <div class="header-content">
                <a class='btn-back' href='index.html'>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </a>
                <div class="header-titles">
                    <h1 x-text="currentProvince || 'Loading...'"></h1>
                    <p class="subtitle">Agromorphological Data Collection</p>
                </div>
            </div>
        </header>

        <div class="config-bar" style="background: var(--bg-input); padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;">
            <div style="display: flex; align-items: center; gap: 8px;">
                <label style="font-weight: 600;">Data Table:</label>
                <select x-model="currentTableId" @change="changeTable()" style="padding: 6px 10px; background: var(--bg-secondary); border: 1px solid var(--border-color); color: white; border-radius: 6px;" class="border-hover">
                    <template x-for="table in availableTables" :key="table.id">
                        <option :value="table.id" x-text="table.name"></option>
                    </template>
                </select>
            </div>
            
            <div style="display: flex; align-items: center; gap: 8px;">
                <label style="font-weight: 600;">Number of Trials:</label>
                <button type="button" @click="decrementTrials()" 
                        style="width: 32px; height: 32px; background: var(--bg-secondary); border: 1px solid var(--border-color); color: white; border-radius: 6px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center;"
                        class="border-hover"
                >
                    −
                </button>
                <span x-text="trialCount" style="min-width: 40px; text-align: center; font-size: 16px; font-weight: 600;"></span>
                <button type="button" @click="incrementTrials()" 
                        style="width: 32px; height: 32px; background: var(--bg-secondary); border: 1px solid var(--border-color); color: white; border-radius: 6px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center;"
                        class="border-hover"
                >
                    +
                </button>
                <span style="color: var(--text-muted); font-size: 12px;">(1-20 trials)</span>
            </div>
            
            <div style="color: var(--accent-success); font-size: 14px;">
                📊 <span x-text="currentTableName"></span> | 📏 <span x-text="trialCount"></span> trials | 📋 <span x-text="parameters.length"></span> parameters
            </div>
        </div>

        <div class="form-container">
            <form @submit.prevent="saveForm()">
                <input type="hidden" name="province" x-model="currentProvince">
                <input type="hidden" name="edit-index" x-model="editIndex">
                <input type="hidden" name="tableId" x-model="currentTableId">
                
                <div class="metadata-grid">
                    <div class="input-group">
                        <label for="treatment-no">Block No. / Treatment No.</label>
                        <input type="text" id="treatment-no" name="treatment-no" required 
                               x-model="treatmentNo"
                               placeholder="e.g. B1-T1">
                    </div>
                    <div class="input-group">
                        <label for="landrace">Landrace Name / Sample ID</label>
                        <input type="text" id="landrace" name="landrace" required 
                               x-model="landrace"
                               placeholder="e.g. Traditional Rice A">
                    </div>
                </div>

                <div class="section-divider">
                    <span x-text="`${currentTableName} (${trialCount} Trials per Sample)`"></span>
                </div>

          <template x-for="param in parameters" :key="param.id">
              <div class="form-group">
                  <label x-text="param.label"></label>
                  <div class="trial-row" :style="`grid-template-columns: repeat(${trialCount}, 1fr);`">
            
                      <template x-if="param.type === 'select'">
                          <template x-for="(trial, idx) in trials" :key="idx">
                              <div class="trial-input-wrapper" :data-trial="`T${idx + 1}`">
                                  <select x-show="isParamVisibleForTrial(param, idx)"
                                          x-model="trials[idx][param.id]"
                                          @change="onControlChange(param.id, idx)">
                                      <option value="">Select...</option>
                                      <template x-for="(label, value) in param.options">
                                          <option :value="value" x-text="`${value}-${label}`"></option>
                                      </template>
                                  </select>
                                  <div x-show="!isParamVisibleForTrial(param, idx)"
                                       style="color: var(--text-muted); text-align: center; padding: 8px; background: var(--bg-input); border-radius: 6px; font-size: 12px;">
                                      ⚡ Not applicable
                                  </div>
                              </div>
                          </template>
                      </template>
            
                      <template x-if="param.type === 'number'">
                          <template x-for="(trial, idx) in trials" :key="idx">
                              <div class="trial-input-wrapper" :data-trial="`T${idx + 1}`">
                                  <input x-show="isParamVisibleForTrial(param, idx)"
                                         type="number" 
                                         :step="param.step || '1'"
                                         :min="param.min || 0"
                                         x-model="trials[idx][param.id]"
                                         @input="updateTrialValue(param.id, idx)"
                                         :placeholder="`T${idx + 1}`">
                                  <div x-show="!isParamVisibleForTrial(param, idx)"
                                       style="color: var(--text-muted); text-align: center; padding: 8px; background: var(--bg-input); border-radius: 6px; font-size: 12px;">
                                      ⚡ Not applicable
                                  </div>
                              </div>
                          </template>
                      </template>
            
                      <template x-if="param.type === 'text'">
                          <template x-for="(trial, idx) in trials" :key="idx">
                              <div class="trial-input-wrapper" :data-trial="`T${idx + 1}`">
                                  <input x-show="isParamVisibleForTrial(param, idx)"
                                         type="text" 
                                         x-model="trials[idx][param.id]"
                                         :placeholder="`T${idx + 1}`">
                                  <div x-show="!isParamVisibleForTrial(param, idx)"
                                       style="color: var(--text-muted); text-align: center; padding: 8px; background: var(--bg-input); border-radius: 6px; font-size: 12px;">
                                      ⚡ Not applicable
                                  </div>
                              </div>
                          </template>
                      </template>
                  </div>
              </div>
          </template>

                <div class="button-group">
                    <a class='btn btn-secondary' href='index.html' x-show="!editMode" style="transition: background 0.2s ease;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                        Back
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                            <polyline points="17 21 17 13 7 13 7 21"></polyline>
                            <polyline points="7 3 7 8 15 8"></polyline>
                        </svg>
                        <span x-text="editMode ? 'Update Record' : 'Save Data'"></span>
                    </button>
                    <button type="button" class="btn btn-tertiary" style="transition: background 0.2s ease;"
                            x-show="editMode" 
                            @click="cancelEdit()"
                            style="display: none;">Cancel</button>
                </div>
            </form>
        </div>

        <div class="records-section">
            <div class="section-header">
                <h2>Records Preview</h2>
            </div>
            <div class="table-container">
                <table id="records-table">
                    <thead>
                        <tr>
                            <th>Province</th>
                            <th>Table</th>
                            <th>Block No. / Treatment No.</th>
                            <th>Landrace Name / Sample ID</th>
                            <th>Trials</th>
                            <th>Edit</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="(record, idx) in filteredRecords" :key="idx">
                            <tr>
                                <td x-text="record.province"></td>
                                <td x-text="record.tableName || record.tableId"></td>
                                <td x-text="record.treatmentNo"></td>
                                <td><strong x-text="record.landrace"></strong></td>
                                <td x-text="record.trialCount || 5"></td>
                                <td class="action-btns">
                                    <button class="btn-icon edit" @click="editForm(idx)" title="Edit Record Form">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                            <path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                        </svg>
                                    </button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
                <div class="empty-state" x-show="filteredRecords.length === 0" style="text-align: center; padding: 40px; color: #8b949e;">
                    No records found yet. Start by entering data above!
                </div>
            </div>
        </div>
    </div>
</body>
</html>
