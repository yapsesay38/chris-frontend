<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Record Rice Characteristics - CAR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    <div class="container" x-data="riceDataApp()" x-init="init()">
        <header class="app-header">
            <div class="header-content">
                <a class='btn-back' href='index.html'>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </a>
                <div class="header-titles">
                    <h1 x-text="currentProvince || 'Loading...'"></h1>
                    <p class="subtitle">Agromorphological Data Collection</p>
                </div>
            </div>
        </header>

        <div class="form-container">
            <form @submit.prevent="saveRecord()">
                <input type="hidden" name="province" x-model="currentProvince">
                <input type="hidden" name="edit-index" x-model="editIndex">
                
                <div class="metadata-grid">
                    <div class="input-group">
                        <label for="treatment-no">Block No. / Treatment No.</label>
                        <input type="text" id="treatment-no" name="treatment-no" required 
                               x-model="treatmentNo"
                               placeholder="e.g. B1-T1">
                    </div>
                    <div class="input-group">
                        <label for="landrace">Landrace Name</label>
                        <input type="text" id="landrace" name="landrace" required 
                               x-model="landrace"
                               placeholder="e.g. Traditional Rice A">
                    </div>
                </div>

                <div class="section-divider">
                    <span>Agromorphological Parameters (5 Trials)</span>
                </div>

                <!--FORM-->
                <template x-for="param in parameters" :key="param.id">
                    <div class="form-group">
                        <label x-text="param.label"></label>
                        <div class="trial-row">
                            <!-- 5 trials -->
                            <template x-for="(trial, idx) in trials" :key="idx">
                                <div class="trial-input-wrapper" :data-trial="`T${idx + 1}`">
                                    <!-- Select dropdown for categorical parameters -->
                                    <select x-if="param.type === 'select'" 
                                            x-model="trials[idx][param.id]" 
                                            @change="updateAverage(param.id)">
                                        <option value="">Select...</option>
                                        <template x-for="(label, value) in param.options">
                                            <option :value="value" x-text="`${value}-${label}`"></option>
                                        </template>
                                    </select>
                                    
                                    <!-- Number input for numeric parameters -->
                                    <input x-if="param.type === 'number'" 
                                           type="number" 
                                           :step="param.step || '1'"
                                           x-model="trials[idx][param.id]" 
                                           @input="updateAverage(param.id)"
                                           :placeholder="`T${idx + 1}`">
                                </div>
                            </template>
                            
                            <!-- Average field -->
                            <div class="trial-avg-wrapper">
                                <span class="avg-label">AVG</span>
                                <input type="text" class="avg-field" readonly 
                                       :value="averages[param.id] || ''">
                            </div>
                        </div>
                    </div>
                </template>

                <div class="button-group">
                    <a class='btn btn-secondary' href='index.html'>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                        Back
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                            <polyline points="17 21 17 13 7 13 7 21"></polyline>
                            <polyline points="7 3 7 8 15 8"></polyline>
                        </svg>
                        <span x-text="editMode ? 'Update Record' : 'Save Data'"></span>
                    </button>
                    <button type="button" class="btn btn-secondary" 
                            x-show="editMode" 
                            @click="cancelEdit()"
                            style="display: none;">Cancel Edit</button>
                </div>
            </form>
        </div>

        <div class="records-section">
            <div class="section-header">
                <h2>Records Preview</h2>
                <button class="export-btn" @click="exportToCSV()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    Export to Excel (CSV)
                </button>
            </div>
            <div class="table-container">
                <table id="records-table">
                    <thead>
                        <tr>
                            <th>Province</th>
                            <th>Block/Treatment</th>
                            <th>Landrace</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="(record, idx) in filteredRecords" :key="idx">
                            <tr>
                                <td x-text="record.province"></td>
                                <td x-text="record.treatmentNo"></td>
                                <td><strong x-text="record.landrace"></strong></td>
                                <td class="action-btns">
                                    <button class="btn-icon edit" @click="editRecord(idx)" title="Edit Record">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                            <path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                        </svg>
                                    </button>
                                    <button class="btn-icon delete" @click="deleteRecord(idx)" title="Delete Record">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <polyline points="3 6 5 6 21 6"></polyline>
                                            <path d="M19 6v14a2 2 0 0 1-2-2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                            <line x1="10" y1="11" x2="10" y2="17"></line>
                                            <line x1="14" y1="11" x2="14" y2="17"></line>
                                        </svg>
                                    </button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
                <div class="empty-state" x-show="filteredRecords.length === 0" style="text-align: center; padding: 40px; color: #8b949e;">
                    No records found yet. Start by entering data above!
                </div>
            </div>
        </div>
    </div>

    <script>
        function riceDataApp() {
            const STORAGE_KEY = 'heirloom_rice_records';
            
            // ============================================
            // DATA-DRIVEN PARAMETERS - Add/remove easily!
            // ============================================
            const parameters = [
                {
                    id: 'plantVigor',
                    label: 'Plant Vigor and Leaf Characteristics',
                    type: 'select',
                    options: {
                        '1': 'Very Vigorous',
                        '2': 'Vigorous',
                        '3': 'Normal',
                        '4': 'Weak',
                        '5': 'Very Weak'
                    }
                },
                {
                    id: 'basalLeafSheet',
                    label: 'Basal Leaf Sheet',
                    type: 'select',
                    options: {
                        '1': 'Green',
                        '2': 'Purple Lines',
                        '3': 'Light Purple',
                        '4': 'Purple'
                    }
                },
                {
                    id: 'leafSheathAnthocyanin',
                    label: 'Leaf Sheath Anthocyanin Coloration',
                    type: 'select',
                    options: {
                        '0': 'Absent',
                        '3': 'Weak',
                        '5': 'Medium',
                        '7': 'Strong'
                    }
                },
                {
                    id: 'bladeAnthocyanin',
                    label: 'Blade Anthocyanin Coloration',
                    type: 'select',
                    options: {
                        '1': 'Tips Only',
                        '2': 'On Margins Only',
                        '3': 'In Blotches',
                        '4': 'Even (Uniform Purple)'
                    }
                },
                {
                    id: 'bladeIntensityGreen',
                    label: 'Blade Intensity of Green Color',
                    type: 'select',
                    options: {
                        '0': 'No Green Color',
                        '3': 'Light Green',
                        '5': 'Medium Green',
                        '7': 'Dark Green'
                    }
                },
                {
                    id: 'bladePubescence',
                    label: 'Blade Pubescence',
                    type: 'select',
                    options: {
                        '1': 'Glabrous',
                        '2': 'Intermediate',
                        '3': 'Pubescent'
                    }
                },
                {
                    id: 'auricleColor',
                    label: 'Auricle Color',
                    type: 'select',
                    options: {
                        '0': 'Absent',
                        '1': 'Whitish',
                        '2': 'Yellowish Green',
                        '3': 'Purple',
                        '4': 'Light Purple',
                        '5': 'Purple Lines'
                    }
                },
                {
                    id: 'collarColor',
                    label: 'Collar Color',
                    type: 'select',
                    options: {
                        '0': 'Absent',
                        '1': 'Green',
                        '2': 'Light Green',
                        '3': 'Purple',
                        '4': 'Purple Lines'
                    }
                },
                {
                    id: 'liguleShape',
                    label: 'Ligule Shape',
                    type: 'select',
                    options: {
                        '0': 'Absent',
                        '1': 'Truncate',
                        '2': 'Acute to Acuminate',
                        '3': '2-Cleft'
                    }
                },
                {
                    id: 'liguleColor',
                    label: 'Ligule Color',
                    type: 'select',
                    options: {
                        '0': 'Absent',
                        '1': 'Whitish',
                        '2': 'Yellowish Green',
                        '3': 'Purple',
                        '4': 'Light Purple',
                        '5': 'Purple Lines'
                    }
                },
                {
                    id: 'liguleLength',
                    label: 'Ligule Length (mm)',
                    type: 'number',
                    step: '0.1'
                },
                {
                    id: 'flagLeafAttitude',
                    label: 'Flag Leaf Attitude',
                    type: 'select',
                    options: {
                        '1': 'Erect',
                        '3': 'Intermediate',
                        '5': 'Horizontal',
                        '7': 'Descending'
                    }
                },
                {
                    id: 'leafLength',
                    label: 'Flag Leaf and Penultimate Leaf Length (cm)',
                    type: 'number',
                    step: '0.1'
                },
                {
                    id: 'leafWidth',
                    label: 'Flag Leaf and Penultimate Leaf Width (cm)',
                    type: 'number',
                    step: '0.1'
                },
                {
                    id: 'culmHabitAngle',
                    label: 'Culm Habit Angle',
                    type: 'select',
                    options: {
                        '1': 'Erect (<15°)',
                        '3': 'Semi-erect (20°)',
                        '5': 'Open (40°)',
                        '7': 'Spreading (>60°-80°)',
                        '9': 'Procumbent'
                    }
                },
                {
                    id: 'tillerCount',
                    label: 'Tiller Count',
                    type: 'number',
                    step: '1'
                }
            ];
            
            // Helper functions
            const loadRecords = () => JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            const saveRecords = (records) => localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
            
            // Get province from URL
            const urlParams = new URLSearchParams(window.location.search);
            const provinceFromUrl = urlParams.get('province') || '';
            
            // Build initial trials object dynamically from parameters
            const buildEmptyTrial = () => {
                const trial = {};
                parameters.forEach(param => {
                    trial[param.id] = '';
                });
                return trial;
            };
            
            return {
                // State
                currentProvince: provinceFromUrl,
                treatmentNo: '',
                landrace: '',
                editMode: false,
                editIndex: -1,
                isOnline: navigator.onLine,
                parameters: parameters,  // Expose to template
                trials: Array(5).fill().map(() => buildEmptyTrial()),
                averages: {},
                records: loadRecords(),
                
                // Computed: Filter records by current province
                get filteredRecords() {
                    if (!this.currentProvince) return this.records;
                    return this.records.filter(r => r.province === this.currentProvince);
                },
                
                // Update average for a parameter
                updateAverage(paramId) {
                    let sum = 0, count = 0;
                    
                    this.trials.forEach(trial => {
                        const val = trial[paramId];
                        if (val !== '' && !isNaN(val)) {
                            sum += parseFloat(val);
                            count++;
                        }
                    });
                    
                    this.averages[paramId] = count > 0 ? (sum / count).toFixed(2) : '';
                    this.saveDraft();
                },
                
                // Save draft to localStorage
                saveDraft() {
                    const draftKey = `rice_draft_${this.currentProvince || 'unknown'}`;
                    const hasData = this.trials.some(trial => 
                        Object.values(trial).some(v => v !== '' && v !== null)
                    ) || this.treatmentNo || this.landrace;
                    
                    if (hasData) {
                        const draft = {
                            treatmentNo: this.treatmentNo,
                            landrace: this.landrace,
                            trials: this.trials,
                            averages: this.averages
                        };
                        localStorage.setItem(draftKey, JSON.stringify(draft));
                    }
                },
                
                // Load draft from localStorage
                loadDraft() {
                    if (this.editMode) return;
                    
                    const draftKey = `rice_draft_${this.currentProvince || 'unknown'}`;
                    const draft = JSON.parse(localStorage.getItem(draftKey));
                    
                    if (draft) {
                        this.treatmentNo = draft.treatmentNo || '';
                        this.landrace = draft.landrace || '';
                        if (draft.trials) this.trials = draft.trials;
                        if (draft.averages) this.averages = draft.averages;
                    }
                },
                
                // Clear draft
                clearDraft() {
                    const draftKey = `rice_draft_${this.currentProvince || 'unknown'}`;
                    localStorage.removeItem(draftKey);
                },
                
                // Save record
                saveRecord() {
                    if (!this.treatmentNo || !this.landrace) {
                        alert('Please fill in Block/Treatment No. and Landrace Name');
                        return;
                    }
                    
                    const record = {
                        province: this.currentProvince,
                        treatmentNo: this.treatmentNo,
                        landrace: this.landrace,
                        trials: JSON.parse(JSON.stringify(this.trials)),
                        averages: JSON.parse(JSON.stringify(this.averages)),
                        timestamp: Date.now()
                    };
                    
                    if (this.editMode && this.editIndex >= 0) {
                        this.records[this.editIndex] = record;
                        saveRecords(this.records);
                        alert('Record updated successfully!');
                        this.cancelEdit();
                    } else {
                        this.records.push(record);
                        saveRecords(this.records);
                        alert('Data saved successfully!');
                        this.resetForm();
                    }
                    
                    this.clearDraft();
                    this.records = loadRecords();
                },
                
                // Edit record
                editRecord(index) {
                    const record = this.records[index];
                    
                    this.editMode = true;
                    this.editIndex = index;
                    this.currentProvince = record.province;
                    this.treatmentNo = record.treatmentNo;
                    this.landrace = record.landrace;
                    this.trials = JSON.parse(JSON.stringify(record.trials));
                    this.averages = JSON.parse(JSON.stringify(record.averages));
                    
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                },
                
                // Delete record
                deleteRecord(index) {
                    if (confirm('Are you sure you want to delete this record?')) {
                        this.records.splice(index, 1);
                        saveRecords(this.records);
                        this.records = loadRecords();
                    }
                },
                
                // Cancel edit
                cancelEdit() {
                    this.editMode = false;
                    this.editIndex = -1;
                    this.resetForm();
                },
                
                // Reset form
                resetForm() {
                    this.treatmentNo = '';
                    this.landrace = '';
                    this.trials = Array(5).fill().map(() => buildEmptyTrial());
                    this.averages = {};
                    
                    if (this.currentProvince) this.loadDraft();
                },
                
                // Export to CSV
                exportToCSV() {
                    if (this.records.length === 0) {
                        alert('No records to export.');
                        return;
                    }
                    
                    const headers = ['Province', 'Block/Treatment No.', 'Landrace Name'];
                    const params = this.parameters.map(p => p.id);
                    
                    params.forEach(p => {
                        headers.push(`${p.toUpperCase()} AVG`);
                        for (let i = 1; i <= 5; i++) headers.push(`${p.toUpperCase()} T${i}`);
                    });
                    
                    const csvRows = [headers.join(',')];
                    
                    this.records.forEach(record => {
                        const row = [record.province, record.treatmentNo, record.landrace];
                        
                        params.forEach(param => {
                            row.push(record.averages[param] || '');
                            for (let i = 0; i < 5; i++) {
                                row.push(record.trials[i][param] || '');
                            }
                        });
                        
                        csvRows.push(row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(','));
                    });
                    
                    const csvContent = "\uFEFF" + csvRows.join('\n');
                    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = `heirloom_rice_records_${new Date().toISOString().slice(0,10)}.csv`;
                    link.click();
                    URL.revokeObjectURL(url);
                },
                
                // Update offline banner
                updateOfflineBanner(isOffline) {
                    const banner = document.getElementById('offline-banner');
                    if (banner) {
                        banner.style.display = isOffline ? 'block' : 'none';
                    }
                },
                
                // Initialize
                init() {
                    window.addEventListener('online', () => { 
                        this.isOnline = true;
                        this.updateOfflineBanner(false);
                    });
                    window.addEventListener('offline', () => { 
                        this.isOnline = false;
                        this.updateOfflineBanner(true);
                    });
                    
                    this.loadDraft();
                    
                    if (this.currentProvince) {
                        document.title = `${this.currentProvince} - CAR Rice Collection`;
                    }
                    
                    this.updateOfflineBanner(!navigator.onLine);
                }
            };
        }
        
        // Service Worker registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch((err) => {
                    console.log('ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>
</body>
</html>
